name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Extract changelog for release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          notes="$(mktemp)"
          {
            echo "Download the bundle for your distribution below."
            echo ""
            echo "- \`.deb\` — Debian / Ubuntu"
            echo "- \`.rpm\` — Fedora / openSUSE"
            echo "- \`.AppImage\` — any distribution"
            echo ""
            echo "The \`.sig\` files and \`latest.json\` are used by the built-in updater."
            echo ""
          } > "$notes"
          python3 - "$VERSION" "$notes" <<'PY'
          import re
          import sys

          version, path = sys.argv[1], sys.argv[2]
          text = open("CHANGELOG.md").read()
          match = re.search(
              r"## \[\s*" + re.escape(version) + r"\s*\].*?(?=\n## \[|\Z)",
              text,
              re.S,
          )
          section = match.group(0).strip() if match else ""
          if not section:
              section = "_No changelog entry for this version yet._"
          with open(path, "a") as f:
              f.write(section + "\n")
          PY
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat "$notes" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          rm -f "$notes"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'ShareV ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.updater.conf.json
