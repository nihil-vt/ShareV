<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#12151b"/>
    </linearGradient>
    <linearGradient id="sidebarBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#171b22"/>
      <stop offset="100%" style="stop-color:#14181f"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2430"/>
      <stop offset="100%" style="stop-color:#1a1f2a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8cff"/>
      <stop offset="100%" style="stop-color:#7b5cff"/>
    </linearGradient>
    <linearGradient id="linuxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c00"/>
      <stop offset="100%" style="stop-color:#ffcc00"/>
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background ambient glow -->
  <ellipse cx="320" cy="220" rx="300" ry="200" fill="url(#accentGrad)" opacity="0.04"/>

  <!-- Main window -->
  <rect x="60" y="30" width="520" height="380" rx="16" fill="url(#heroBg)" stroke="#2b3240" stroke-width="1" filter="url(#shadow1)"/>

  <!-- Title bar -->
  <path d="M60 46 Q60 30 76 30 L564 30 Q580 30 580 46 L580 70 L60 70 Z" fill="#171b22"/>
  <circle cx="82" cy="50" r="5" fill="#ff6b6b"/>
  <circle cx="100" cy="50" r="5" fill="#ffcc00"/>
  <circle cx="118" cy="50" r="5" fill="#3fbf7f"/>
  <text x="320" y="54" text-anchor="middle" fill="#98a2b3" font-size="11" font-family="system-ui" font-weight="500">ShareV</text>

  <!-- Sidebar -->
  <path d="M60 70 L60 410 L60 410 Q60 410 60 410 L140 410 L140 70 Z" fill="url(#sidebarBg)"/>
  <line x1="140" y1="70" x2="140" y2="410" stroke="#2b3240" stroke-width="0.5"/>

  <!-- Sidebar icons -->
  <rect x="78" y="88" width="18" height="18" rx="5" fill="url(#linuxGrad)"/>
  <rect x="78" y="118" width="18" height="18" rx="5" fill="none" stroke="#2b3240" stroke-width="1.5"/>
  <rect x="78" y="148" width="18" height="18" rx="5" fill="none" stroke="#2b3240" stroke-width="1.5"/>
  <rect x="78" y="178" width="18" height="18" rx="5" fill="none" stroke="#2b3240" stroke-width="1.5"/>
  <rect x="78" y="208" width="18" height="18" rx="5" fill="none" stroke="#2b3240" stroke-width="1.5"/>
  <rect x="78" y="238" width="18" height="18" rx="5" fill="none" stroke="#2b3240" stroke-width="1.5"/>
  <rect x="78" y="268" width="18" height="18" rx="5" fill="none" stroke="#2b3240" stroke-width="1.5"/>
  <rect x="78" y="298" width="18" height="18" rx="5" fill="none" stroke="#2b3240" stroke-width="1.5"/>

  <!-- Sidebar labels -->
  <text x="104" y="101" fill="#e7ebf2" font-size="9" font-family="system-ui" font-weight="500">Capture</text>
  <text x="104" y="131" fill="#98a2b3" font-size="9" font-family="system-ui">Record</text>
  <text x="104" y="161" fill="#98a2b3" font-size="9" font-family="system-ui">History</text>
  <text x="104" y="191" fill="#98a2b3" font-size="9" font-family="system-ui">Editor</text>
  <text x="104" y="221" fill="#98a2b3" font-size="9" font-family="system-ui">Settings</text>
  <text x="104" y="251" fill="#98a2b3" font-size="9" font-family="system-ui">Uploads</text>
  <text x="104" y="281" fill="#98a2b3" font-size="9" font-family="system-ui">Tasks</text>
  <text x="104" y="311" fill="#98a2b3" font-size="9" font-family="system-ui">Pin</text>

  <!-- Content area background -->
  <rect x="140" y="70" width="440" height="340" fill="#12151b"/>

  <!-- Section title -->
  <text x="165" y="100" fill="#e7ebf2" font-size="13" font-family="system-ui" font-weight="600">Screen Capture</text>

  <!-- Capture mode cards -->
  <rect x="165" y="115" width="125" height="80" rx="10" fill="url(#cardBg)" stroke="#2b3240" stroke-width="1"/>
  <rect x="200" y="128" width="55" height="30" rx="4" fill="none" stroke="#ff8c00" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="200" cy="128" r="3" fill="#ff8c00"/>
  <circle cx="255" cy="128" r="3" fill="#ff8c00"/>
  <circle cx="200" cy="158" r="3" fill="#ff8c00"/>
  <circle cx="255" cy="158" r="3" fill="#ff8c00"/>
  <text x="227" y="180" text-anchor="middle" fill="#e7ebf2" font-size="10" font-family="system-ui" font-weight="500">Region</text>

  <rect x="305" y="115" width="125" height="80" rx="10" fill="url(#cardBg)" stroke="#2b3240" stroke-width="1"/>
  <rect x="325" y="128" width="85" height="55" rx="4" fill="none" stroke="#4f8cff" stroke-width="1.5"/>
  <text x="367" y="180" text-anchor="middle" fill="#e7ebf2" font-size="10" font-family="system-ui" font-weight="500">Fullscreen</text>

  <rect x="445" y="115" width="125" height="80" rx="10" fill="url(#cardBg)" stroke="#2b3240" stroke-width="1"/>
  <rect x="470" y="130" width="75" height="50" rx="4" fill="none" stroke="#7b5cff" stroke-width="1.5"/>
  <line x1="470" y1="145" x2="545" y2="145" stroke="#7b5cff" stroke-width="1" opacity="0.5"/>
  <text x="507" y="180" text-anchor="middle" fill="#e7ebf2" font-size="10" font-family="system-ui" font-weight="500">Window</text>

  <!-- Delay selector -->
  <text x="165" y="225" fill="#98a2b3" font-size="10" font-family="system-ui">Delay</text>
  <rect x="210" y="212" width="30" height="20" rx="5" fill="#232936" stroke="#2b3240" stroke-width="1"/>
  <text x="225" y="226" text-anchor="middle" fill="#e7ebf2" font-size="9" font-family="system-ui">0s</text>
  <rect x="245" y="212" width="30" height="20" rx="5" fill="#232936" stroke="#2b3240" stroke-width="1"/>
  <text x="260" y="226" text-anchor="middle" fill="#98a2b3" font-size="9" font-family="system-ui">3s</text>
  <rect x="280" y="212" width="30" height="20" rx="5" fill="#232936" stroke="#2b3240" stroke-width="1"/>
  <text x="295" y="226" text-anchor="middle" fill="#98a2b3" font-size="9" font-family="system-ui">5s</text>
  <rect x="315" y="212" width="35" height="20" rx="5" fill="#232936" stroke="#2b3240" stroke-width="1"/>
  <text x="332" y="226" text-anchor="middle" fill="#98a2b3" font-size="9" font-family="system-ui">10s</text>

  <!-- Capture button -->
  <rect x="445" y="210" width="125" height="26" rx="8" fill="url(#linuxGrad)"/>
  <text x="507" y="227" text-anchor="middle" fill="#1a1a2e" font-size="10" font-family="system-ui" font-weight="700">Capture</text>

  <!-- Preview area -->
  <rect x="165" y="250" width="405" height="140" rx="10" fill="url(#cardBg)" stroke="#2b3240" stroke-width="1"/>
  <text x="185" y="275" fill="#98a2b3" font-size="10" font-family="system-ui">Last capture</text>

  <!-- Preview thumbnail -->
  <rect x="185" y="285" width="160" height="80" rx="6" fill="#232936"/>
  <rect x="200" y="300" width="60" height="30" rx="3" fill="none" stroke="#4f8cff" stroke-width="1.5"/>
  <line x1="275" y1="315" x2="315" y2="315" stroke="#ff6b6b" stroke-width="1.5"/>
  <circle cx="330" cy="315" r="8" fill="none" stroke="#3fbf7f" stroke-width="1.5"/>

  <!-- Preview info -->
  <text x="365" y="305" fill="#e7ebf2" font-size="10" font-family="system-ui" font-weight="500">screenshot_2026.png</text>
  <text x="365" y="322" fill="#98a2b3" font-size="9" font-family="system-ui">2.4 MB — 1920 x 1080</text>
  <text x="365" y="339" fill="#98a2b3" font-size="9" font-family="system-ui">Captured 2 min ago</text>

  <!-- Action buttons -->
  <rect x="365" y="350" width="50" height="20" rx="5" fill="#232936" stroke="#2b3240" stroke-width="1"/>
  <text x="390" y="364" text-anchor="middle" fill="#98a2b3" font-size="8" font-family="system-ui">Copy</text>
  <rect x="422" y="350" width="50" height="20" rx="5" fill="#232936" stroke="#2b3240" stroke-width="1"/>
  <text x="447" y="364" text-anchor="middle" fill="#98a2b3" font-size="8" font-family="system-ui">Edit</text>
  <rect x="479" y="350" width="50" height="20" rx="5" fill="#232936" stroke="#2b3240" stroke-width="1"/>
  <text x="504" y="364" text-anchor="middle" fill="#98a2b3" font-size="8" font-family="system-ui">Upload</text>
  <rect x="536" y="350" width="20" height="20" rx="5" fill="#232936" stroke="#2b3240" stroke-width="1"/>
  <text x="546" y="364" text-anchor="middle" fill="#98a2b3" font-size="8" font-family="system-ui">...</text>

  <!-- Floating notification -->
  <rect x="420" y="15" width="180" height="36" rx="10" fill="#1c212b" stroke="url(#linuxGrad)" stroke-width="1" filter="url(#shadow2)"/>
  <circle cx="440" cy="33" r="4" fill="#3fbf7f"/>
  <text x="452" y="30" fill="#e7ebf2" font-size="9" font-family="system-ui" font-weight="500">Capture complete</text>
  <text x="452" y="43" fill="#98a2b3" font-size="8" font-family="system-ui">Link copied to clipboard</text>

  <!-- Version badge -->
  <text x="565" y="400" text-anchor="end" fill="#98a2b3" font-size="8" font-family="system-ui">v0.2.0</text>
</svg>