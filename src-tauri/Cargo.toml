[package]
name = "sharev"
version = "0.2.0"
description = "ShareX-style screenshot capture and sharing for Linux"
authors = ["ShareV contributors"]
license = "MIT"
repository = "https://github.com/nihil-vt/ShareV"
homepage = "https://github.com/nihil-vt/ShareV"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sharev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sharev"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-log = "2"
dirs = "7.0.0"
toml = "0.8"
chrono = "0.4.45"
image = "0.25.10"
tokio = { version = "1.53.2", features = ["process", "rt", "rt-multi-thread", "macros", "time", "io-util", "sync", "signal"] }
ulid = "3.0.0"
async-trait = "0.1.92"
thiserror = "1"
libc = "0.2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls"] }

# Tauri plugins
tauri-plugin-fs = "2.7.0"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-clipboard-manager = "2.4.2"
tauri-plugin-shell = "2.5.0"
tauri-plugin-notification = "2.6.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# XDG Desktop Portal (Wayland global shortcuts).
ashpd = { version = "0.13.13", features = ["global_shortcuts"] }
futures-util = "0.3"
